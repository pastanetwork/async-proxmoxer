[pytest]
# Enable pytest-asyncio
asyncio_mode = auto

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=proxmoxer
    --cov-report=term-missing
    --cov-report=html

# Test paths
testpaths = tests

# Markers
markers =
    unit: Unit tests (fast, mocked)
    integration: Integration tests (may require real Proxmox instance)
    slow: Slow tests
    helpers: Tests for helper modules

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
